name: Deploy Next.js Admin Dashboard

on:
  push:
    branches:
      - main
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # =========================
      # BUILD FOR UAT
      # =========================
      - name: Build for UAT
        if: github.ref == 'refs/heads/test'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://shoption-calltracker-ap-testing-hgcpd2f2dshygtef.centralindia-01.azurewebsites.net
        run: |
          echo "Building for UAT"
          npm run build

      # =========================
      # BUILD FOR PROD
      # =========================
      - name: Build for Production
        if: github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://shoption-calltracker-api-cjdjatchb5bzb9dp.centralindia-01.azurewebsites.net
        run: |
          echo "Building for Production"
          npm run build

      # =========================
      # DEPLOY PROD
      # =========================
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: adminleadlens
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PROD }}
          package: .

      # =========================
      # DEPLOY UAT
      # =========================
      - name: Deploy to UAT
        if: github.ref == 'refs/heads/test'
        uses: azure/webapps-deploy@v3
        with:
          app-name: adminleadlens
          slot-name: uat
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_UAT }}
          package: .
